<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - FinOps AI</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="fragments :: public-header"></div>

<main class="auth-shell">
    <section class="auth-layout">
        <div>
            <p class="eyebrow">Your FinOps workspace</p>
            <h1>Welcome back.</h1>
            <p class="lead">Pick up your analysis, review optimization opportunities, and plan your next cloud cost move.</p>
            <div class="auth-points"><span>Report analysis</span><span>Cost scenarios</span><span>Decision history</span></div>
        </div>
        <form class="upload-panel auth-card" th:action="@{/login}" method="post">
            <h2>Sign In</h2>

            <div th:if="${param.error}">
                <p class="error">Invalid username or password.</p>
            </div>
            <div th:if="${param.logout}">
                <p class="success">You have been logged out.</p>
            </div>
            <div th:if="${success}" th:replace="fragments :: flash-success"></div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="username">Username</label>
            <input id="username" name="username" type="text" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Sign In</button>

            <p class="hint">No account? <a href="/register" style="color: var(--accent); font-weight: 700;">Create one</a></p>
        </form>
    </section>
</main>
<div th:replace="fragments :: site-footer"></div>
</body>
</html>
