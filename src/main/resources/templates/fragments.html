<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="app-header" class="topbar">
    <a class="brand" href="/">
        <span class="brand-mark">F</span>
        <span>FinOps AI</span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
        <a href="/dashboard">Overview</a>
        <a href="/budgets">Budgets</a>
        <a href="/simulation">Planning</a>
        <a href="/">Reports</a>
    </nav>
    <div class="header-actions">
        <span class="connection-state"><span class="connection-dot"></span>Demo workspace</span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="icon-button" type="submit" title="Sign out" aria-label="Sign out">&#8594;</button>
        </form>
    </div>
</header>

<header th:fragment="public-header" class="topbar">
    <a class="brand" href="/">
        <span class="brand-mark">F</span>
        <span>FinOps AI</span>
    </a>
    <nav class="main-nav public-nav" aria-label="Primary navigation">
        <a href="#how-it-works">How it works</a>
        <a href="#sample-data">Sample data</a>
    </nav>
    <a class="nav-cta" href="/login">Sign in</a>
</header>

<footer th:fragment="site-footer" class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <a class="brand" href="/"><span class="brand-mark">F</span><span>FinOps AI</span></a>
            <p>Clearer cloud spend decisions, one report at a time.</p>
        </div>
        <div class="footer-links">
            <a href="/dashboard">Overview</a>
            <a href="/simulation">Planning</a>
            <a href="/">Upload report</a>
        </div>
        <p class="footer-meta">Prototype workspace &middot; Data is stored locally</p>
    </div>
</footer>

<div th:fragment="flash-success" th:if="${success}" th:text="${success}" class="success"></div>
<div th:fragment="flash-error" th:if="${error}" th:text="${error}" class="error"></div>
</body>
</html>
