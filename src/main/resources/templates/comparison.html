<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Comparison - FinOps AI</title><link rel="stylesheet" href="/css/app.css"></head><body class="app-page"><div th:replace="fragments :: app-header"></div><main class="app-shell"><section class="page-heading"><div><p class="eyebrow">Report comparison</p><h1>See what changed</h1><p class="page-subtitle">Compare two private reports to understand cost movement.</p></div><a class="secondary-action" href="/dashboard">Back to overview</a></section><section class="panel"><div class="metric-grid"><article class="metric-card"><span>Baseline cost</span><strong th:text="${'$' + comparison.baselineCost()}">$0</strong><small th:text="${comparison.baselineResources() + ' resources'}">0 resources</small></article><article class="metric-card"><span>Current cost</span><strong th:text="${'$' + comparison.currentCost()}">$0</strong><small th:text="${comparison.currentResources() + ' resources'}">0 resources</small></article><article class="metric-card savings-card"><span>Cost movement</span><strong th:text="${'$' + comparison.costChange()}">$0</strong><small th:text="${comparison.costChangePercent() + '% from baseline'}">0%</small></article></div></section><section class="panel history-panel"><div class="panel-heading"><div><p class="panel-kicker">Compare another pair</p><h2>Reports</h2></div></div><div class="table-scroll"><table><thead><tr><th>Report</th><th>Uploaded</th><th>Use as baseline</th></tr></thead><tbody><tr th:each="upload : ${uploads}"><td th:text="${upload.filename}">report.csv</td><td th:text="${#temporals.format(upload.uploadedAt, 'dd MMM yyyy, HH:mm')}">date</td><td><a class="text-action" th:href="@{/dashboard/{id}(id=${upload.id})}">Open report</a></td></tr></tbody></table></div></section></main><div th:replace="fragments :: site-footer"></div></body></html>
