<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - FinOps AI</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="fragments :: public-header"></div>

<main class="auth-shell">
    <section class="auth-layout">
        <div>
            <p class="eyebrow">Build a clearer cloud budget</p>
            <h1>Start your FinOps workspace.</h1>
            <p class="lead">Create an account to analyze cloud costs, get right-sizing recommendations, and test what-if scenarios.</p>
            <div class="auth-points"><span>Upload utilization data</span><span>Find wasted spend</span><span>Test savings plans</span></div>
        </div>
        <form class="upload-panel auth-card" th:action="@{/register}" method="post">
            <h2>Create Account</h2>

            <div th:if="${error}">
                <p class="error" th:text="${error}"></p>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="username">Username</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="50" autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" maxlength="100">

            <button type="submit">Create Account</button>

            <p class="hint">Already have an account? <a href="/login" style="color: var(--accent); font-weight: 700;">Sign in</a></p>
        </form>
    </section>
</main>
<div th:replace="fragments :: site-footer"></div>
</body>
</html>
