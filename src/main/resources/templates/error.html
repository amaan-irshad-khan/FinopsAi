<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error - FinOps AI</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="fragments :: app-header"></div>

<main class="app-shell">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Error</p>
            <h1>Something went wrong</h1>
        </div>
        <a class="secondary-action" href="/">Go Home</a>
    </section>
    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:unless="${error}">An unexpected error occurred. Please try again.</p>
</main>
<div th:replace="fragments :: site-footer"></div>
</body>
</html>
